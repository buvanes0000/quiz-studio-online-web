<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Studio Online</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t,m={light:"ghost",dark:"knight",green:"forest",cyber:"knight",ghost:"ghost",forest:"forest",knight:"knight"};try{t=m[localStorage.getItem("pdfquiz:v1:theme")]}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"knight":"ghost";document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
:root{--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--head:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--sh,64px) + env(safe-area-inset-top,0px))}
body{margin:0;color:var(--ink);font:500 15px/1.55 var(--sans);background-color:var(--bg);background-image:radial-gradient(900px 380px at 12% -8%,var(--glow),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:auto,22px 22px}
h1,h2{font-family:var(--head)}
h1{font:700 34px/1.12 var(--head);letter-spacing:-.02em;margin:0 0 10px}
h2{font:700 13px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.hide{display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* sticky top: brand, theme switcher, progress, timer bar */
.stick{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 20px -12px var(--shadow)}
@supports (background:color-mix(in srgb,red,blue)){.stick{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.top{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--head);letter-spacing:-.01em;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2));font:800 18px var(--head);box-shadow:0 4px 12px -4px var(--accent)}
.topmid{flex:1;text-align:center;color:var(--mute);font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tbar{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:600 14px var(--sans)}
.tbar.hide{display:none}
.tbar.warn{background:var(--bad-soft);color:var(--bad)}
.tbar b{font:700 17px var(--head);font-variant-numeric:tabular-nums;margin-left:4px}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.net{background:var(--warn-soft);color:var(--ink);border-top:1px solid var(--warn-line);padding:7px 16px;text-align:center;font:600 13px var(--sans)}
.net.hide{display:none}
/* page grid */
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 34px;box-shadow:0 1px 2px var(--shadow),0 18px 40px -22px var(--shadow)}
/* question ticket */
.card.qcard{padding:0;display:grid;grid-template-columns:116px minmax(0,1fr);overflow:hidden}
.qstub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:24px 8px;color:var(--accent-ink);background:linear-gradient(165deg,var(--accent),var(--accent2));text-align:center}
.qstub::before,.qstub::after{content:"";position:absolute;right:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.qstub::before{top:-10px}.qstub::after{bottom:-10px}
.qlab{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.qnum{font:800 46px/1 var(--head);letter-spacing:-.03em}
.qof{font:600 12px var(--sans);opacity:.85}
.qflag{margin-top:10px;font:700 11px var(--sans);background:var(--warn-solid);color:var(--warn-ink);padding:3px 9px;border-radius:999px}
.qbody{padding:26px 32px 30px;min-width:0;border-left:2px dashed var(--line)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{font:700 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-txt);padding:7px 11px;border-radius:999px}
.stem{font:600 19px/1.55 var(--sans);margin:0 0 22px}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px 13px 13px;margin-bottom:11px;font:500 15px/1.45 var(--sans);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 18px -12px var(--accent)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-txt);display:grid;place-items:center;font:800 14px var(--head)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);color:var(--ok-soft)}
.opt.ok::after{content:"✓";margin-left:auto;color:var(--ok);font:800 18px var(--sans)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.no .k{background:var(--bad);color:var(--bad-soft)}
.opt.no::after{content:"✕";margin-left:auto;color:var(--bad);font:800 16px var(--sans)}
.opt:disabled{cursor:default}
.why{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 15px;border-radius:0 12px 12px 0;margin:4px 0 16px;font-size:14px}
.why b{display:block;margin-bottom:4px}
.why span,.rev small{white-space:pre-line}
/* buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:12px;padding:11px 20px;font:700 14px var(--sans);cursor:pointer;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 18px -10px var(--accent);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.prev{background:var(--accent-soft);color:var(--accent-txt);box-shadow:none}
.btn.flag{background:var(--danger);color:var(--danger-ink);box-shadow:none}
.btn.flag.on{background:var(--warn-solid);color:var(--warn-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;font:700 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{padding:6px 12px;font-size:12px}
.chip:disabled{opacity:.4;cursor:default}
.num{width:178px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px var(--sans)}
.num.pw{width:220px}
.num::placeholder{color:var(--mute)}
/* navigator */
.side{position:sticky;top:calc(var(--sh,64px) + 14px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 1px 2px var(--shadow),0 18px 40px -22px var(--shadow)}
.side h2{text-align:center;margin-bottom:12px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring.sm{width:116px;height:116px;margin:0 auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--line);stroke-width:10}
.rp{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring.pass .rp{stroke:var(--ok)}.ring.fail .rp{stroke:var(--bad)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font:800 24px/1 var(--head)}
.rcnt{text-align:center;color:var(--mute);font-size:12px;margin:0 0 12px;min-height:18px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--mute);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--accent)}
.legend .f::before{background:var(--warn-line)}.legend .c::before{background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
.cell{position:relative;aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface2);color:var(--mute);border-radius:50%;font:700 11px var(--sans);cursor:pointer;padding:0}
.cell.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-txt)}
.cell.f{box-shadow:0 0 0 2px var(--warn-line)}
.cell.f::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn-line);border:1.5px solid var(--surface)}
.cell.cur{background:var(--ink);border-color:var(--ink);color:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.submit{width:100%;padding:13px}
/* start screen */
.eyebrow{display:inline-block;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-txt);background:var(--accent-soft);padding:6px 12px;border-radius:999px;margin-bottom:14px}
.steps{list-style:none;display:flex;gap:10px;flex-wrap:wrap;padding:0;margin:0 0 22px;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:9px;color:var(--mute);font-weight:700;font-size:13px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font:800 12px var(--head)}
.steps li.on{color:var(--ink)}.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--ok-soft)}
.steps li:not(:last-child)::after{content:"";width:28px;height:2px;background:var(--line);margin-left:4px}
.drop{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:18px;padding:22px 24px;margin-bottom:8px;transition:background .15s}
.drop.over{background:var(--surface2);border-style:solid}
.drop.done{border-style:solid;border-color:var(--line);background:var(--surface2);padding:14px 18px}
.dropleft{display:flex;align-items:center;gap:14px;min-width:0}
.pdfbadge{flex:none;width:48px;height:56px;border-radius:8px 14px 8px 8px;background:var(--surface);border:2px solid var(--accent);color:var(--accent-txt);display:grid;place-items:end center;padding-bottom:6px;font:800 10.5px var(--head);letter-spacing:.02em}
.droptxt{display:flex;flex-direction:column;min-width:0}
.droptxt b{font:700 17px var(--head);overflow-wrap:anywhere}
.droptxt span{color:var(--mute);font-size:13px}
.sec{margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:20px}
.cards>.sec{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.note{color:var(--mute);font-size:12.5px;margin:8px 0 0}
.launch{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px;padding:14px 18px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--line)}
.sum{font-weight:600;color:var(--ink);margin:0;font-size:14px;flex:1;min-width:220px}
/* results */
.rhero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:6px}
.rinfo{flex:1;min-width:240px}
.rinfo h2{font:800 28px/1.15 var(--head);letter-spacing:-.02em;text-transform:none;color:var(--ink);margin:0 0 6px}
.rinfo p{margin:0 0 6px}
.score{font:800 38px/1 var(--head);letter-spacing:-.02em;position:absolute;inset:0;display:grid;place-items:center}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tile{min-width:92px;padding:10px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tile b{display:block;font:800 22px/1.1 var(--head)}
.tile span{font-size:12px;color:var(--mute)}
.tile.g b{color:var(--ok)}.tile.r b{color:var(--bad)}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:var(--surface)}
.rev p{margin:0 0 8px;font-weight:600}
.rev small{color:var(--mute);font-size:12.5px;display:block;margin-top:6px}
.st{display:inline-block;font:800 10.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;margin-right:8px;vertical-align:1px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.no{background:var(--bad-soft);color:var(--bad)}.st.na{background:var(--warn-soft);color:var(--warn)}
.ro{display:flex;gap:10px;padding:7px 10px;border-radius:10px;margin:4px 0;font-size:13.5px;border:1px solid transparent}
.ro b{flex:none;width:20px}
.ro.ok{background:var(--ok-soft);border-color:var(--ok)}.ro.no{background:var(--bad-soft);border-color:var(--bad)}
.chips+div{margin-top:12px}
.warn{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:14px;margin-bottom:14px;color:var(--ink)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;background:var(--surface)}
.sinfo{display:flex;flex-direction:column;font-size:12.5px;color:var(--mute);min-width:0}
.sinfo b{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.perm{border:1.5px solid var(--accent);background:var(--surface);border-radius:16px;padding:16px 18px;margin:16px 0}
.perm h2{margin-bottom:6px}
.perm .chips,.perm .pwrow{margin-top:10px}
.pwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* break / pause overlay */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.ov.hide{display:none}
.ov h1{font:800 34px/1.2 var(--head);margin:0 0 8px}
.ov .sub{max-width:460px;margin:0 auto 10px}
.big{font:800 60px/1.1 var(--head);font-variant-numeric:tabular-nums;margin:12px 0 22px;color:var(--accent)}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static}.topmid{display:none}.brand{flex:1}}
@media (max-width:640px){.card{padding:22px 18px;border-radius:18px}.card.qcard{grid-template-columns:1fr;padding:0}.qstub{flex-direction:row;gap:10px;padding:10px 16px;justify-content:flex-start}.qstub::before,.qstub::after{display:none}.qnum{font-size:26px}.qlab{display:none}.qflag{margin:0 0 0 auto}.qbody{padding:20px 18px 24px;border-left:0}h1{font-size:28px}.bname{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* single theme button + dropdown */
.thmenu{position:relative}
.thbtn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:6px 12px 6px 8px;border-radius:999px;font:700 13px var(--sans);cursor:pointer}
.thbtn svg{width:14px;height:14px;transition:transform .15s}
.thbtn[aria-expanded="true"]{border-color:var(--accent)}
.thbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sw{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;flex:none}
.thlist{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 20px 46px -14px var(--shadow),0 2px 6px var(--shadow)}
.thlist.hide{display:none}
.th-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:11px;font:700 14px var(--sans);cursor:pointer}
.th-opt:hover,.th-opt:focus-visible{background:var(--accent-soft)}
.th-opt small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.th-opt .tick{margin-left:auto;color:var(--accent);font-weight:800;visibility:hidden}
.th-opt[aria-checked="true"] .tick{visibility:visible}
@media (max-width:640px){.thbtn .tn{display:none}.thbtn{padding:6px 10px 6px 8px}}
:root,:root[data-theme="ghost"]{--bg:#efedf7;--surface:#fdfcff;--surface2:#f5f3fb;--ink:#25223b;--mute:#5e5a7a;--line:#dad6ec;--dot:#dcd8ee;--glow:rgba(139,120,230,.22);--accent:#6a58d6;--accent2:#8a5fd0;--accent-ink:#ffffff;--accent-soft:#e9e5fb;--accent-txt:#473aa3;--ok:#1f7a58;--ok-soft:#dcf3ea;--bad:#b02e48;--bad-soft:#fbe5ea;--warn:#7a4d00;--warn-soft:#fff0d2;--warn-line:#e0a21c;--danger:#b02e48;--danger-ink:#ffffff;--warn-solid:#f2b230;--warn-ink:#2b1d00;--shadow:rgba(37,34,59,.14);--ol:#4a3fa8;--sh-solid:rgba(74,63,168,.16);--head:"Fredoka","Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;color-scheme:light}
:root[data-theme="forest"]{--bg:#e6f0e1;--surface:#fbfdf8;--surface2:#f0f6ec;--ink:#14301f;--mute:#4b6653;--line:#c5d9c4;--dot:#cfe0cb;--glow:rgba(46,125,76,.20);--accent:#2f7d4f;--accent2:#2a7a63;--accent-ink:#ffffff;--accent-soft:#d9ebd6;--accent-txt:#1e5a38;--ok:#1b6e36;--ok-soft:#d4eed9;--bad:#b3342b;--bad-soft:#fbe3df;--warn:#7a4a00;--warn-soft:#fff0cf;--warn-line:#d99208;--danger:#b3342b;--danger-ink:#ffffff;--warn-solid:#f2a413;--warn-ink:#2b1d00;--shadow:rgba(20,48,31,.16);--ol:#2a5a3c;--sh-solid:rgba(42,90,60,.22);--head:"Fredoka","Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;color-scheme:light}
:root[data-theme="knight"]{--bg:#07080c;--surface:#11141b;--surface2:#171b25;--ink:#ecebe6;--mute:#a3a8b5;--line:#2a3040;--dot:#11141c;--glow:rgba(255,196,0,.10);--accent:#ffc400;--accent2:#ff9f1a;--accent-ink:#0b0a05;--accent-soft:#2a2410;--accent-txt:#ffd54a;--ok:#4ade80;--ok-soft:#0f2e1d;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#ffa07a;--warn-soft:#3a1a0e;--warn-line:#ff7a45;--danger:#ff6b6b;--danger-ink:#1a0505;--warn-solid:#ff7a45;--warn-ink:#1a0800;--shadow:rgba(0,0,0,.65);--ol:#2a3040;--sh-solid:transparent;--head:"Oswald","Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;color-scheme:dark}

/* theme art layers */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1}
.logo svg{width:21px;height:21px}
.hero{position:relative}
.hero h1,.hero .sub{max-width:min(62ch,calc(100% - 270px))}
.heroart{position:absolute;right:2px;top:-10px;width:250px;pointer-events:none}
.heroart svg{width:100%;height:auto;display:block}
.qic{display:grid;place-items:center;margin-bottom:8px;color:var(--accent-ink);opacity:.92}
.qic svg{width:32px;height:32px}
@media (max-width:900px){.heroart{display:none}.hero h1,.hero .sub{max-width:none}}
@media (max-width:640px){.qic{display:none}}
/* Green Forest and Ghost: cartoon outlines with flat offset shadows */
:root[data-theme="forest"] .card,:root[data-theme="forest"] .side,:root[data-theme="ghost"] .card,:root[data-theme="ghost"] .side{border:2px solid var(--ol);box-shadow:6px 6px 0 var(--sh-solid)}
:root[data-theme="forest"] .btn:not(.ghost):not(.prev):not(.flag),:root[data-theme="ghost"] .btn:not(.ghost):not(.prev):not(.flag){border:2px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}
:root[data-theme="forest"] .btn:hover:not(:disabled),:root[data-theme="ghost"] .btn:hover:not(:disabled){transform:translate(-1px,-1px)}
:root[data-theme="forest"] .stick,:root[data-theme="ghost"] .stick{border-bottom:2px solid var(--ol)}
:root[data-theme="forest"] .drop,:root[data-theme="ghost"] .drop{border-width:2.5px}
:root[data-theme="forest"] h1,:root[data-theme="ghost"] h1{font-weight:600;letter-spacing:0}
:root[data-theme="forest"] .qnum,:root[data-theme="ghost"] .qnum{font-weight:600}
/* Dark Knight: charcoal, signal yellow, condensed type */
:root[data-theme="knight"] h1,:root[data-theme="knight"] .rinfo h2,:root[data-theme="knight"] .brand,:root[data-theme="knight"] .ov h1{text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="knight"] h1{font-weight:700}
:root[data-theme="knight"] .qstub{background:linear-gradient(165deg,#ffc400,#e08a00)}
:root[data-theme="knight"] .card,:root[data-theme="knight"] .side{border:1px solid var(--ol);box-shadow:inset 0 1px 0 rgba(255,196,0,.10),0 26px 60px -26px #000}
:root[data-theme="knight"] .stick{border-bottom-color:rgba(255,196,0,.4)}
:root[data-theme="knight"] .prog i{box-shadow:0 0 10px rgba(255,196,0,.6)}
:root[data-theme="knight"] .opt:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 18px -6px var(--accent)}
:root[data-theme="knight"] .btn{box-shadow:0 8px 20px -10px var(--accent)}
:root[data-theme="knight"] .btn.ghost,:root[data-theme="knight"] .btn.prev,:root[data-theme="knight"] .btn.flag{box-shadow:none}
.sw.s-forest{background:linear-gradient(135deg,#e6f0e1 50%,#2f7d4f 50%)}
.sw.s-knight{background:linear-gradient(135deg,#07080c 50%,#ffc400 50%)}
.sw.s-ghost{background:linear-gradient(135deg,#efedf7 50%,#6a58d6 50%)}
.logbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:6px 13px 6px 10px;border-radius:999px;font:700 13px var(--sans);cursor:pointer}
.logbtn svg{width:16px;height:16px}
.logbtn:disabled{opacity:.4;cursor:default}
.logbtn:hover:not(:disabled){border-color:var(--accent)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;background:var(--surface)}
.lscore{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--head);border:3px solid var(--line)}
.lscore.pass{border-color:var(--ok);color:var(--ok)}.lscore.fail{border-color:var(--bad);color:var(--bad)}
.linfo{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12.5px;color:var(--mute)}
.linfo b{color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.lcounts{display:flex;gap:12px;flex-wrap:wrap;font-weight:600;color:var(--ink)}
.flbox{margin-top:24px}
details.fl{border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:10px 0;background:var(--surface2)}
details.fl>summary{cursor:pointer;font-weight:700;padding:4px 0}
.dlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:20px}
.dlgbox{background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:18px;padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px -20px #000}
.dlgbox .num{width:100%}
.dlgbox h2{margin:0}
@media (max-width:640px){.logbtn .tn{display:none}.lrow{grid-template-columns:auto minmax(0,1fr)}.lrow .chips{grid-column:1/-1}}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.tile:hover{border-color:var(--accent)}
button.tile[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.tilelist{border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;margin:14px 0 18px;background:var(--surface2)}
.tlhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tlhead h2{margin:0}
.card.authcard{padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:hidden;max-width:940px;margin:28px auto}
.authside{background:linear-gradient(160deg,var(--accent),var(--accent2));color:var(--accent-ink);padding:34px 30px;display:flex;flex-direction:column;gap:14px}
.authside h2{color:inherit;font:800 28px/1.15 var(--head);text-transform:none;letter-spacing:-.01em;margin:0}
.authart{background:rgba(255,255,255,.16);border-radius:18px;padding:10px}
.authart svg{width:100%;height:auto;display:block}
.authlist{margin:0;padding-left:18px;font-weight:600;font-size:13.5px;line-height:1.5}
.authform{padding:34px 36px;min-width:0}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font:700 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:600 15px var(--sans)}
.keep{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin:6px 0 10px}
.keep input{width:18px;height:18px;accent-color:var(--accent)}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font:800 12px var(--head)}
.uhead{margin:0;padding:8px 10px 6px;font-size:12px;font-weight:700;color:var(--mute);overflow-wrap:anywhere}
@media (max-width:760px){.card.authcard{grid-template-columns:1fr;margin:8px auto}.authside{padding:22px}.authart{display:none}.authform{padding:24px 20px}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 18px;border-radius:12px;border:1.5px solid #dadce0;background:#fff;color:#3c4043;font:600 15px var(--sans);cursor:pointer;box-shadow:0 1px 2px rgba(60,64,67,.25)}
.gbtn:hover:not(:disabled){background:#f8f9fa;box-shadow:0 1px 4px rgba(60,64,67,.35)}
.gbtn:disabled{opacity:.6;cursor:default}
.gbtn svg{width:20px;height:20px;flex:none}
.sync{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block;flex:none}
.sync.idle,.sync.synced{background:var(--ok)}
.sync.syncing{background:var(--warn-solid);animation:pulse 1s infinite}
.sync.error{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.onl{font:800 10px var(--sans);font-style:normal;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:2px}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.setup{padding-left:20px;margin:0 0 6px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.sync.syncing,.spin{animation:none}}
</style>
</head>

<script>
const L = "ABCDE";
const $ = id => document.getElementById(id);
const main = $("main");
// ---------- cartoon-sketch art for each theme ----------
const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const WOB = id => '<filter id="' + id + '" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>';
const SVG = (vb, inner, par) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '"' + (par ? ' preserveAspectRatio="' + par + '"' : '') + ' aria-hidden="true">' + inner + '</svg>';
const cloudP = (x, y, s, f, st) => `<path transform="translate(${x} ${y}) scale(${s})" d="M-60 0C-82 0-82-30-50-30-50-54-8-58 2-36 22-60 64-46 56-22 82-22 84 0 60 0Z" fill="${f}" stroke="${st}" stroke-width="3"/>`;
const SCENES = {
  forest(){
    const pine = (x, y, s, a, b) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-16" width="8" height="16" fill="#7a5233" stroke="#4a2f19" stroke-width="2"/><path d="M-36-14L0-72 36-14Z" fill="${a}" stroke="#1b4d33" stroke-width="2.4"/><path d="M-30-44L0-98 30-44Z" fill="${b}" stroke="#1b4d33" stroke-width="2.4"/><path d="M-23-72L0-122 23-72Z" fill="${a}" stroke="#1b4d33" stroke-width="2.4"/></g>`;
    const oak = (x, y, s, c) => { const k = `fill="${c}" stroke="#1b4d33" stroke-width="2.4"`; return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-6 0L-4-44 4-44 6 0Z" fill="#7a5233" stroke="#4a2f19" stroke-width="2"/><circle cx="-22" cy="-56" r="22" ${k}/><circle cx="22" cy="-56" r="22" ${k}/><circle cx="0" cy="-78" r="26" ${k}/><circle cx="0" cy="-54" r="24" ${k}/></g>`; };
    const shroom = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-6 0Q-7-14-4-16L4-16Q7-14 6 0Z" fill="#fbf1dc" stroke="#6b4a2f" stroke-width="2"/><path d="M-22-16Q-20-40 0-40 20-40 22-16 0-10-22-16Z" fill="#e0624d" stroke="#7a2a20" stroke-width="2.2"/><circle cx="-9" cy="-28" r="3" fill="#fff"/><circle cx="6" cy="-31" r="3.4" fill="#fff"/><circle cx="12" cy="-23" r="2.4" fill="#fff"/></g>`;
    const tuft = (x, y) => `<path d="M${x} ${y}q-7-16-12-24M${x} ${y}q0-20 2-30M${x} ${y}q7-14 14-22" fill="none" stroke="#2f7d4f" stroke-width="3"/>`;
    const r = rng(11); let ff = "", rays = "", birds = "";
    for (let i = 0; i < 16; i++){ const x = r() * 1440 | 0, y = 560 + r() * 240 | 0; ff += `<circle cx="${x}" cy="${y}" r="9" fill="#fff6a8" opacity=".25"/><circle cx="${x}" cy="${y}" r="3" fill="#fff3a0"/>`; }
    for (let k = 0; k < 12; k++){ const a = k * Math.PI / 6; rays += `<path d="M${(1385 + Math.cos(a) * 58).toFixed(0)} ${(120 + Math.sin(a) * 58).toFixed(0)}L${(1385 + Math.cos(a) * 76).toFixed(0)} ${(120 + Math.sin(a) * 76).toFixed(0)}" stroke="#c7922a" stroke-width="3" fill="none"/>`; }
    [[30, 330], [100, 365], [1330, 400]].forEach(([x, y]) => { birds += `<path d="M${x} ${y}q8-10 16 0 8-10 16 0" fill="none" stroke="#2a5a3c" stroke-width="3"/>`; });
    const hill = (f, d) => `<path d="${d}" fill="${f}" stroke="#4f8a55" stroke-width="2.5"/>`;
    return SVG("0 0 1440 900", `<defs>${WOB("wf")}</defs>
<g filter="url(#wf)" stroke-linecap="round" stroke-linejoin="round"><circle cx="1385" cy="120" r="44" fill="#ffe28a" stroke="#c7922a" stroke-width="3"/>${rays}${cloudP(40, 190, 1, "#fff", "#9db99a")}${cloudP(1370, 300, .8, "#fff", "#9db99a")}${cloudP(300, 100, .6, "#fff", "#9db99a")}${birds}</g>
${hill("#b7d5ae", "M0 700C220 620 420 670 640 650S1050 590 1240 650 1400 670 1440 660L1440 900 0 900Z")}
<g filter="url(#wf)" stroke-linecap="round" stroke-linejoin="round">${pine(60, 712, .9, "#3a8f5c", "#2f7d4f")}${pine(150, 700, 1.1, "#2f7d4f", "#3a8f5c")}${pine(262, 716, .8, "#3a8f5c", "#2f7d4f")}${pine(1170, 668, 1, "#2f7d4f", "#3a8f5c")}${pine(1290, 676, .85, "#3a8f5c", "#2f7d4f")}${pine(1390, 684, 1.15, "#2f7d4f", "#3a8f5c")}${oak(700, 668, .45, "#6fb06f")}${pine(560, 690, .45, "#3a8f5c", "#2f7d4f")}</g>
${hill("#9ccb94", "M0 760C200 700 380 740 600 720S980 690 1180 735 1360 750 1440 735L1440 900 0 900Z")}
<g filter="url(#wf)" stroke-linecap="round" stroke-linejoin="round">${oak(34, 768, 1.05, "#5aa468")}${oak(214, 774, .9, "#6fb06f")}${pine(340, 780, 1.25, "#2f7d4f", "#3a8f5c")}${oak(1120, 748, 1, "#5aa468")}${oak(1262, 760, 1.2, "#6fb06f")}${pine(1400, 772, 1.3, "#2f7d4f", "#3a8f5c")}${oak(900, 735, .5, "#6fb06f")}</g>
${hill("#7ab877", "M0 830C260 800 500 835 760 815S1180 800 1440 828L1440 900 0 900Z")}
<g filter="url(#wf)" stroke-linecap="round" stroke-linejoin="round">${shroom(96, 862, 1.2)}${shroom(132, 872, .8)}${shroom(396, 866, 1)}${shroom(1060, 864, 1.1)}${shroom(1336, 868, 1.3)}${[20, 170, 300, 470, 640, 800, 960, 1180, 1250, 1420].map(x => tuft(x, 880 + (x % 3) * 4)).join("")}${ff}</g>`, "xMidYMax slice");
  },
  knight(){
    const r = rng(7); let stars = "";
    for (let i = 0; i < 46; i++){ const x = r() * 1440 | 0, y = r() * 430 | 0; stars += `<circle cx="${x}" cy="${y}" r="${r() < .2 ? 2.2 : 1.2}" fill="#fff" opacity="${(.3 + r() * .5).toFixed(2)}"/>`; }
    const sky = (color, minH, maxH, seed, lit) => {
      const q = rng(seed); let x = -20, out = "";
      while (x < 1460){
        const w = 44 + q() * 52, hh = minH + q() * (maxH - minH), y = 900 - hh;
        out += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${hh.toFixed(0)}" fill="${color}"/>`;
        const t = q();
        if (t > .78) out += `<path d="M${x.toFixed(0)} ${y.toFixed(0)}L${(x + w / 2).toFixed(0)} ${(y - 34 - q() * 30).toFixed(0)} ${(x + w).toFixed(0)} ${y.toFixed(0)}Z" fill="${color}"/>`;
        else if (t > .6) out += `<rect x="${(x + w * .3).toFixed(0)}" y="${(y - 18).toFixed(0)}" width="${(w * .4).toFixed(0)}" height="18" fill="${color}"/>`;
        for (let wy = y + 14; wy < 860; wy += 22) for (let wx = x + 8; wx < x + w - 10; wx += 16) if (q() < lit) out += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="7" height="10" fill="#ffc400" opacity="${(.5 + q() * .45).toFixed(2)}"/>`;
        x += w + q() * 8;
      }
      return out;
    };
    const bat = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 2C-10-10-30-12-46-2-36-2-32 4-30 12-24 5-16 6-12 13-8 7-4 8 0 12 4 8 8 7 12 13 16 6 24 5 30 12 32 4 36-2 46-2 30-12 10-10 0 2Z" fill="#020204" stroke="#3a4152" stroke-width="2"/><path d="M-5 0L-4-9 0-3 4-9 5 0Z" fill="#020204" stroke="#3a4152" stroke-width="2"/></g>`;
    return SVG("0 0 1440 900", `<defs>${WOB("wk")}<radialGradient id="kg"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient><linearGradient id="kb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc400" stop-opacity=".42"/><stop offset="1" stop-color="#ffc400" stop-opacity="0"/></linearGradient><linearGradient id="kf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080c" stop-opacity="0"/><stop offset="1" stop-color="#07080c" stop-opacity=".9"/></linearGradient></defs>
${stars}<circle cx="1220" cy="150" r="150" fill="url(#kg)"/>
<g filter="url(#wk)"><circle cx="1220" cy="150" r="76" fill="#f4efd8" stroke="#cfc6a0" stroke-width="3"/><circle cx="1196" cy="130" r="14" fill="#e3dcb9"/><circle cx="1246" cy="176" r="10" fill="#e3dcb9"/><circle cx="1230" cy="108" r="7" fill="#e3dcb9"/><path d="M1120 190C1160 170 1210 184 1250 168S1330 176 1350 196L1350 210 1120 210Z" fill="#1a1e29" opacity=".85"/>${bat(1090, 112, 1)}${bat(1330, 70, .8)}${bat(980, 270, .7)}${bat(170, 190, 1.2)}${bat(380, 120, .6)}</g>
<polygon points="860,640 690,0 1020,0" fill="url(#kb)"/>
${sky("#10131b", 150, 330, 3, .12)}
<rect x="820" y="640" width="80" height="260" fill="#05060a"/><rect x="850" y="627" width="20" height="13" fill="#2a3040"/><ellipse cx="860" cy="627" rx="15" ry="5" fill="#ffd54a"/>
${sky("#05060a", 70, 220, 9, .1)}
<g filter="url(#wk)"><rect x="236" y="500" width="48" height="400" fill="#05060a"/><path d="M230 500L260 410 290 500Z" fill="#05060a"/><circle cx="260" cy="548" r="14" fill="#ffc400" opacity=".9"/><path d="M260 548V538M260 548L268 552" stroke="#05060a" stroke-width="2.5"/></g>
<rect x="0" y="760" width="1440" height="140" fill="url(#kf)"/>`, "xMidYMax slice");
  },
  ghost(){
    const ghost = (x, y, s, rot, face) => {
      const ol = `stroke="#4a3fa8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"`;
      const faces = [

async function libSave(name, kind, items){
  const id = "b" + hash32(name + "|" + items.map(q => q.n + q.q).join("|"));
  try {
    await Cloud.bankPut(id, items);
    sSet("lib", [{id, name, kind, count: items.length, date: Date.now()}].concat((sGet("lib") || []).filter(x => x.id !== id)));
    return true;
  } catch (e) { return false; }
}
function libSection(){

  idx.forEach(m => {

    info.append(el("b","",m.name), el("span","", m.count + " questions · " + m.kind + " · " + when(m.date)), msg);

    use.onclick = async () => {

      try { const items = await Cloud.bankGet(m.id); ALL = items; pdfName = m.name; docKind = m.kind; cfg.count = ALL.length; cfg.start = 1; note = "Loaded " + m.name + " from your library (" + ALL.length + " questions)."; renderStart(); }

function savedSection(){

function keepChoiceOrder(q){
  const t = q.options.join(" | ");
  return /\b(all|none|neither|both)\b[^|]*\b(above|these|them|of the)\b/i.test(t) || /\b[A-D]\s*(and|&|,)\s*[A-D]\b/.test(t)
    || /\b(option|choice)s?\s*\(?[A-D]\b/i.test(t + " " + q.explanation)
    || /(^|\n)\s*[•\-*]?\s*\(?[A-D]\)?\s*(is|are|=|:|–)\s/.test(q.explanation);
}
function shuffleChoices(q){
  if (keepChoiceOrder(q)) return q;
  const order = shuffle(q.options.map((_, k) => k));
  return Object.assign({}, q, {options: order.map(k => q.options[k]), answer: order.indexOf(q.answer)});
}
function start(){
  const {pool, c} = plan(); if (!pool.length) return;
  const pick = (cfg.order === "shuffle" ? shuffle(pool) : pool).slice(0, c);
  qs = cfg.opts === "shuffle" ? pick.map(shuffleChoices) : pick;
  ans = qs.map(()=>null); flags = qs.map(()=>false); i = 0; view = "quiz"; curId = attemptId = newId(); reviewOnly = false; fromLog = false; beginTimer(qs.length); render();
}

function renderGrid(){
  const g = $("grid"); g.innerHTML = "";
  qs.forEach((q,j) => {
    const b = el("button","cell",String(j+1));
    if(ans[j] !== null) b.classList.add("a");
    if(flags[j]) b.classList.add("f");
    if(j === i) b.classList.add("cur");
    b.setAttribute("aria-label","Question "+(j+1)+(ans[j]!==null?", answered":"")+(flags[j]?", flagged":""));
    if(j === i) b.setAttribute("aria-current","true");
    b.onclick = () => { i = j; view = "quiz"; render(); };
    g.appendChild(b);
  });
  const done = ans.filter(a => a !== null).length, fl = flags.filter(Boolean).length;
  $("rprog").style.strokeDashoffset = (2 * Math.PI * 52 * (1 - done / Math.max(1, qs.length))).toFixed(1);
  $("rpct").textContent = Math.round(done / Math.max(1, qs.length) * 100) + "%";
  $("rcnt").textContent = done + " of " + qs.length + " answered" + (fl ? " · " + fl + " flagged" : "");
}

function renderQuiz(){
  const q = qs[i], picked = ans[i], practice = cfg.mode === "practice";
  $("side").classList.remove("hide");
  $("fill").style.width = (ans.filter(a=>a!==null).length/qs.length*100) + "%";
  main.innerHTML = "";
  const stub = el("div","qstub"), qi = el("span","qic"); qi.setAttribute("aria-hidden","true"); qi.innerHTML = ICON[curTheme()]; stub.append(qi, el("span","qlab","Question"), el("b","qnum",String(i+1)), el("span","qof","of "+qs.length));
  if (flags[i]) stub.appendChild(el("span","qflag","⚑ Flagged"));
  const body = el("div","qbody"); main.append(stub, body);
  const tags = el("div","tags");
  tags.append(el("span","tag","PDF Q"+q.n));
  if (q.cat !== "General") tags.append(el("span","tag",q.cat));
  body.append(tags, el("p","stem",q.q));
  q.options.forEach((t,k) => {
    const b = el("button","opt"); b.append(el("span","k",L[k]), el("span","",t));
    const locked = practice && picked !== null;
    if(locked){ if(k === q.answer) b.classList.add("ok"); else if(k === picked) b.classList.add("no"); }

  });

}

function renderConfirm(){

function reviewItem(q, j){

    d.appendChild(r);

function renderResult(){
  const sessionId = attemptId;
  if (!reviewOnly && curId){ delRecord(curId); curId = null; }
  $("side").classList.add("hide"); $("fill").style.width = "100%";
  const right = ans.reduce((n,a,j)=> n + (a === qs[j].answer ? 1 : 0), 0);

  main.innerHTML = "";

  };
  [["g", right, "Correct", "right"], ["r", wrongN, "Wrong", "wrong"], ["", skipN, "Unanswered", "blank"]].concat(flagN ? [["g", flagRight, "Flagged & right", "flagright"]] : []).forEach(([c, v, l, k]) => {

function render(){
